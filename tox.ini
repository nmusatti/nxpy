[tox]
minversion = 4.0
envlist = py{311,312,313,314,315}-{lnx,mac,win}

[testenv]
platform = 
    lnx: linux
    mac: darwin
    win: win32

# Each environment gets its own test directory, so that tox -p works
set_env =
    NXPY_TEST_DIR={envtmpdir}

pass_env =
    JAVA_HOME
    M2_HOME
    win: USERNAME

allowlist_externals = 
    mvn

deps =
    pytest
    pytest-cov
    six
	-e libs/abstract
	-e libs/backup_file
	-e libs/command
	-e libs/core
	-e libs/file
	-e libs/file_object
	-e libs/maven
	-e libs/memo
	-e libs/nonblocking_subprocess
	-e libs/past
	-e libs/path
	-e libs/ply
	-e libs/sequence
	-e libs/sort
	-e libs/svn
	-e libs/temp_file
	-e libs/test
	-e libs/xml

commands =
    python test/bin/setup_test_env.py
    #python -m pytest --color=yes libs -s --log-cli-level=DEBUG
    python -m pytest --color=yes libs -s
